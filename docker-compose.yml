version: '3.8'

services:
  exchange:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-api
    ports:
      - "8080:8080"
    environment:
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY:-}
      - AUTH_SERVICE_URL=http://auth:8080
      - EXCHANGE_API_BASE_URL=https://v6.exchangerate-api.com/v6/${EXCHANGE_API_KEY:-}/latest
      - REQUEST_TIMEOUT=6.0
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - auth
    restart: unless-stopped

  auth:
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "8081:8080"
    networks:
      - microservices
    restart: unless-stopped

networks:
  microservices:
    driver: bridge
